root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = ["daemon", "-f", "--pid-file", "/data/akira.pid"]
  bin = "./tmp/akira"
  cmd = "go build -buildvcs=false -ldflags '-X main.Version=dev -X main.BuildTime=dev' -o ./tmp/akira ."
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "data", "bin", "releases", "scripts"]
  exclude_regex = ["_test\\.go$"]
  exclude_unchanged = false
  include_ext = ["go", "tpl", "tmpl", "html"]
  # poll mode works reliably with Docker volume mounts on WSL2/Windows hosts
  poll = true
  poll_interval = 500
  send_interrupt = true
  stop_on_error = false

[color]
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = true

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = true
  keep_scroll = true
